name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Temporary dependency for this draft; switch to the released SDK before merge.
      - uses: actions/checkout@v7
        with:
          repository: michalmedvecky/edupage-api
          ref: f47bb1379de5818642723499234b5d1f49998948
          path: .test-edupage-api

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest voluptuous-serialize pytest-homeassistant-custom-component .test-edupage-api unidecode

      - name: Run tests
        run: pytest tests -v
